name: Verify customer workspace preview
on:
  push:
    branches: [codex/subscription-lifecycle, codex/guided-customer-setup, codex/daily-business-operations, codex/owner-support-controls]
    paths: ['.github/workflows/subscription-preview.yml', 'components/platform/**', 'app/api/platform/**', 'app/platform/**', 'app/admin/platform/**', 'components/automation/PlatformSupportView.tsx', 'lib/platform-operator.ts', 'lib/platform-setup.ts', 'lib/platform-work.ts', 'workers/triumph-automations/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-staging-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/codex/subscription-lifecycle' || github.ref == 'refs/heads/codex/guided-customer-setup' || github.ref == 'refs/heads/codex/daily-business-operations' || github.ref == 'refs/heads/codex/owner-support-controls' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:automation
      - run: npm run test:cloudflare
      - run: npm ci
        working-directory: workers/triumph-automations
      - run: npm run check && npm test
        working-directory: workers/triumph-automations
      - name: Build with public configuration only
        env:
          SITE_PUBLIC_CONFIG: ${{ vars.SITE_PUBLIC_CONFIG }}
        run: npm run build:cloudflare
      - name: Deploy the existing website preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/cloudflare-runtime-env.mjs
          npx wrangler deploy --dry-run --keep-vars
          npx wrangler deploy --keep-vars
      - name: Check preview route
        run: |
          node -e "const r=await fetch('https://triumphant-hq-web-preview.triumphantsam30.workers.dev/platform');if(r.status!==200||!r.headers.get('x-robots-tag')?.includes('noindex'))throw Error('Preview route check failed');console.log('Preview: 200, noindex');"
