name: Deploy production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Service to publish from main
        type: choice
        default: all
        options: [all, website, scanner, redirects]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.number) || 'production-deploy' }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.targets.outputs.website }}
      scanner: ${{ steps.targets.outputs.scanner }}
      redirects: ${{ steps.targets.outputs.redirects }}
      verify: ${{ steps.targets.outputs.verify }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - id: targets
        run: node scripts/deployment-targets.mjs

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/deployment-targets.test.mjs scripts/follow-up-preview.test.mjs
      - run: npm run test:automation
      - run: npm run test:cloudflare
      - run: npx tsx --test netlify/scanner/scanner.test.ts lib/follow-up-preview-response.test.ts cloudflare/legacy-redirect/worker.test.ts
      - name: Validate clean hosted website build on pull requests
        if: github.event_name == 'pull_request'
        env:
          SITE_PUBLIC_CONFIG: ${{ vars.SITE_PUBLIC_CONFIG }}
        run: npm run build:cloudflare

  scanner:
    needs: [changes, verify]
    if: needs.changes.outputs.scanner == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global netlify-cli@27.14.2
      - name: Link isolated scanner project
        working-directory: netlify/scanner
        run: |
          mkdir -p .netlify
          node -e "require('node:fs').writeFileSync('.netlify/state.json',JSON.stringify({siteId:'e931abc2-e905-4dce-bcf7-871710bcd062'}))"
      - name: Publish a draft first
        working-directory: netlify/scanner
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Missing Netlify deployment credential'; exit 1; }
          netlify deploy --no-build --dir public --functions functions --json > "$RUNNER_TEMP/netlify-draft.json"
      - name: Verify signed scans on draft
        env:
          SEO_NODE_SHARED_SECRET: ${{ secrets.SEO_NODE_SHARED_SECRET }}
        run: |
          DRAFT_URL=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP+'/netlify-draft.json','utf8')).deploy_url)")
          npx tsx scripts/check-hosted-scanner.mts "$DRAFT_URL"
      - name: Promote the verified draft
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/publish-netlify-draft.mjs "$RUNNER_TEMP/netlify-draft.json"
      - name: Verify production scanner
        env:
          SEO_NODE_SHARED_SECRET: ${{ secrets.SEO_NODE_SHARED_SECRET }}
        run: npx tsx scripts/check-hosted-scanner.mts https://triumphant-hq-seo.netlify.app

  website:
    needs: [changes, verify, scanner]
    if: always() && needs.changes.outputs.website == 'true' && needs.verify.result == 'success' && (needs.scanner.result == 'success' || needs.scanner.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build using public settings only
        env:
          SITE_PUBLIC_CONFIG: ${{ vars.SITE_PUBLIC_CONFIG }}
        run: |
          test -n "$SITE_PUBLIC_CONFIG" || { echo 'Missing public build configuration'; exit 1; }
          npm run build:cloudflare
      - name: Check production Worker bundle
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --env production
      - name: Deploy production website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9bf344e401d603c114b152f500e6722
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          node node_modules/@opennextjs/cloudflare/dist/cli/index.js deploy --env production --keep-vars
      - name: Check live website
        run: node scripts/check-live-website.mjs

  redirects:
    needs: [changes, verify]
    if: needs.changes.outputs.redirects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy legacy redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9bf344e401d603c114b152f500e6722
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          node node_modules/wrangler/bin/wrangler.js deploy --config cloudflare/legacy-redirect/wrangler.jsonc
      - name: Check legacy redirects
        run: node scripts/check-live-website.mjs --redirects-only
